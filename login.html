{% extends 'base.html' %}{% block title %}Sign in · MindGuard AI{% endblock %}{% block heading %}Welcome back{% endblock %}
{% block content %}<section class="auth-card"><div class="section-kicker">YOUR WELLNESS SPACE</div><h2>Sign in to MindGuard</h2><p class="muted">Use your student ID or counsellor login ID.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="field"><label>Login ID</label><input name="login_id" autocomplete="username" required maxlength="60"></div><div class="field"><label>Password</label><input type="password" name="password" autocomplete="current-password" required></div><button class="btn full">Sign in</button></form><p class="auth-bottom">New student? <a href="{{ url_for('register') }}">Create an account</a></p></section>{% endblock %}
